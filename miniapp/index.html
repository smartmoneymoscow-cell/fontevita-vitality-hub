    <style>
      html { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      body { margin: 0; }

      /* Preloader */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: oklch(0.985 0.006 95);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      #preloader img {
        width: 120px;
        height: auto;
        animation: preloader-float 2s ease-in-out infinite;
      }
      #preloader .brand {
        font-family: "Comfortaa", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: oklch(0.36 0.025 250);
        letter-spacing: -0.01em;
      }
      #preloader .dots {
        display: flex;
        gap: 8px;
      }
      #preloader .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: oklch(0.86 0.135 88);
        animation: preloader-dot 1.2s ease-in-out infinite;
      }
      #preloader .dots span:nth-child(2) { animation-delay: 0.2s; }
      #preloader .dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes preloader-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes preloader-dot {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
