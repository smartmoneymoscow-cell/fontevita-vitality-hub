name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          bun add react-router-dom@6

      - name: Create TanStack Router mock
        run: |
          mkdir -p src/__mocks__
          cat > src/__mocks__/tanstack-router.tsx << 'MOCKEOF'
          import React, { useEffect, useContext, createContext } from "react";
          import {
            Link as RRDLink,
            useLocation,
            useParams,
            useNavigate,
            useSearchParams,
            Outlet as RRDOutlet,
          } from "react-router-dom";

          /* ---------- route registry ---------- */
          const routeConfigs: Record<
            string,
            { component?: React.FC; loader?: (ctx: any) => any; head?: (ctx: any) => any }
          > = {};

          /* ---------- loader context ---------- */
          const LoaderCtx = createContext<any>(undefined);
          function useLoaderData() { return useContext(LoaderCtx); }

          /* ---------- helpers ---------- */
          function normalisePath(p: string) {
            return p === "/" ? "/" : p.replace(/\/+$/, "");
          }

          function matchRoute(pathname: string) {
            const clean = normalisePath(pathname);
            // exact match first
            if (routeConfigs[clean]) return { key: clean, params: {} as Record<string, string> };
            // try pattern matching (longest prefix wins)
            const keys = Object.keys(routeConfigs).sort((a, b) => b.length - a.length);
            for (const key of keys) {
              const parts = key.split("/");
              const pathParts = clean.split("/");
              if (parts.length !== pathParts.length) continue;
              const params: Record<string, string> = {};
              let match = true;
              for (let i = 0; i < parts.length; i++) {
                if (parts[i].startsWith("$")) {
                  params[parts[i].slice(1)] = decodeURIComponent(pathParts[i]);
                } else if (parts[i] !== pathParts[i]) {
                  match = false;
                  break;
                }
              }
              if (match) return { key, params };
            }
            return null;
          }

          /* ---------- exported mocks ---------- */
          export function createFileRoute(path: string) {
            return (config: any) => {
              routeConfigs[normalisePath(path)] = config;
              return { ...config, useLoaderData };
            };
          }

          export function createRootRouteWithContext() {
            return () => ({});
          }

          export function notFound() {
            throw new Error("Not found");
          }

          export function Link({ to, params, hash, children, ...rest }: any) {
            let href = to || "/";
            if (params) {
              for (const [k, v] of Object.entries(params)) {
                href = href.replace(`$${k}`, String(v));
              }
            }
            if (hash) href += `#${hash}`;
            return (
              <RRDLink to={href} {...rest}>
                {children}
              </RRDLink>
            );
          }

          export const Outlet = RRDOutlet;
          export const HeadContent = () => null;
          export const Scripts = () => null;
          export { useParams, useNavigate, useSearchParams, useLocation };

          /* ---------- router component for App.tsx ---------- */
          export function MockRouter() {
            const { pathname } = useLocation();
            const result = matchRoute(pathname);
            const [loaderData, setLoaderData] = React.useState<any>(undefined);
            const [ready, setReady] = React.useState(false);

            React.useEffect(() => {
              let cancelled = false;
              setReady(false);
              if (!result) return;
              const cfg = routeConfigs[result.key];
              if (cfg?.loader) {
                try {
                  const r = cfg.loader({ params: result.params });
                  if (r && typeof r.then === "function") {
                    r.then((data: any) => { if (!cancelled) { setLoaderData(data); setReady(true); } }).catch(() => { if (!cancelled) setReady(true); });
                  } else {
                    if (!cancelled) { setLoaderData(r); setReady(true); }
                  }
                } catch { if (!cancelled) setReady(true); }
              } else {
                if (!cancelled) { setLoaderData(undefined); setReady(true); }
              }
              return () => { cancelled = true; };
            }, [pathname]);

            // process head() for SEO
            React.useEffect(() => {
              if (!result || !ready) return;
              const cfg = routeConfigs[result.key];
              if (cfg?.head) {
                try {
                  const h = cfg.head({ loaderData });
                  if (h?.meta) {
                    for (const m of h.meta) {
                      let el = document.querySelector(
                        m.name
                          ? `meta[name="${m.name}"]`
                          : `meta[property="${m.property}"]`
                      );
                      if (!el) {
                        el = document.createElement("meta");
                        if (m.name) el.setAttribute("name", m.name);
                        if (m.property) el.setAttribute("property", m.property);
                        document.head.appendChild(el);
                      }
                      el.setAttribute("content", m.content);
                    }
                  }
                  if (h?.links) {
                    for (const l of h.links) {
                      if (l.rel === "canonical") {
                        let link = document.querySelector('link[rel="canonical"]');
                        if (!link) {
                          link = document.createElement("link");
                          link.setAttribute("rel", "canonical");
                          document.head.appendChild(link);
                        }
                        link.setAttribute("href", l.href);
                      }
                    }
                  }
                  if (h?.scripts) {
                    for (const s of h.scripts) {
                      const script = document.createElement("script");
                      script.type = "application/ld+json";
                      script.textContent = s.children;
                      document.head.appendChild(script);
                    }
                  }
                } catch {}
              }
            }, [pathname, ready, loaderData]);

            if (!result) return <p style={{ padding: 40 }}>Страница не найдена</p>;

            const cfg = routeConfigs[result.key];
            if (!cfg?.component) return null;

            if (cfg.loader && !ready) return null;

            const Component = cfg.component;
            return (
              <LoaderCtx.Provider value={loaderData}>
                <Component />
              </LoaderCtx.Provider>
            );
          }
          MOCKEOF

      - name: Create SPA entry point
        run: |
          cat > src/main-ghpages.tsx << 'MAINEOF'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import { BrowserRouter } from "react-router-dom";
          import { MockRouter } from "./__mocks__/tanstack-router";
          import "./styles.css";

          // Import route files to register them in the mock
          // These imports trigger side effects (createFileRoute registers routes)
          // We must USE the exports to prevent Vite tree-shaking
          import { Route as IndexRoute } from "./routes/index";
          import { Route as AccountRoute } from "./routes/account";
          import { Route as BlogIndexRoute } from "./routes/blog/index";
          import { Route as BlogSlugRoute } from "./routes/blog/$slug";
          import { Route as BlogCategoryRoute } from "./routes/blog/category/$category";

          // Store routes on window to prevent tree-shaking
          (window as any).__fv_routes = [
            IndexRoute,
            AccountRoute,
            BlogIndexRoute,
            BlogSlugRoute,
            BlogCategoryRoute,
          ];

          function App() {
            return <MockRouter />;
          }

          ReactDOM.createRoot(document.getElementById("root")!).render(
            <React.StrictMode>
              <BrowserRouter basename="/fontevita-vitality-hub">
                <App />
              </BrowserRouter>
            </React.StrictMode>
          );
          MAINEOF

      - name: Create Vite config for GitHub Pages
        run: |
          cat > vite.ghpages.config.ts << 'VITEEOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tsconfigPaths from "vite-tsconfig-paths";
          import tailwindcss from "@tailwindcss/vite";
          import path from "path";
          import fs from "fs";

          // Plugin to handle Lovable .asset.json imports
          // Transforms: import img from "@/assets/foo.png.asset.json"
          // Into: { url: "https://fontevita-vitality-hub.lovable.app/__l5e/assets-v1/..." }
          function lovableAssetPlugin() {
            const LOVABLE = "https://fontevita-vitality-hub.lovable.app";
            return {
              name: "lovable-asset",
              enforce: "pre" as const,
              resolveId(source: string, importer: string) {
                if (source.includes(".asset.json")) {
                  const resolved = path.resolve(
                    path.dirname(importer || process.cwd()),
                    source
                  );
                  return resolved + "?lovable-asset";
                }
                return null;
              },
              load(id: string) {
                if (id.endsWith("?lovable-asset")) {
                  const filePath = id.replace("?lovable-asset", "");
                  try {
                    const raw = fs.readFileSync(filePath, "utf-8");
                    const json = JSON.parse(raw);
                    return `export default ${JSON.stringify({
                      url: LOVABLE + json.url,
                    })}`;
                  } catch {
                    return `export default { url: "" }`;
                  }
                }
                return null;
              },
            };
          }

          export default defineConfig({
            base: "/fontevita-vitality-hub/",
            plugins: [react(), tsconfigPaths(), tailwindcss(), lovableAssetPlugin()],
            resolve: {
              alias: {
                "@": path.resolve(__dirname, "./src"),
                "@tanstack/react-router": path.resolve(
                  __dirname,
                  "./src/__mocks__/tanstack-router"
                ),
                "@tanstack/react-start": path.resolve(
                  __dirname,
                  "./src/__mocks__/tanstack-router"
                ),
              },
            },
            build: {
              outDir: "dist-ghpages",
              rollupOptions: {
                input: "index.html",
                treeshake: {
                  moduleSideEffects: true,
                },
              },
            },
          });
          VITEEOF

      - name: Create index.html
        run: |
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>FonteVita — витамины и БАДы для всей семьи</title>
              <meta name="description" content="FonteVita: коллаген, магний + B6 и омега 3 в проверенных дозировках. Сертифицированные БАДы для энергии, спокойствия и красоты. Доставка по России." />
              <meta property="og:title" content="FonteVita — витамины и БАДы для всей семьи" />
              <meta property="og:description" content="Коллаген, магний + B6 и омега 3 в честных дозировках. Сертифицированное качество FonteVita. Доставка по России." />
              <meta property="og:type" content="website" />
              <meta property="og:url" content="https://fontevita.ru/" />
              <meta property="og:image" content="https://fontevita-vitality-hub.lovable.app/__l5e/assets-v1/ace176ff-1b22-489c-a209-196f67f2c7b6/logo-mark.png" />
              <meta property="og:locale" content="ru_RU" />
              <meta name="twitter:card" content="summary_large_image" />
              <meta name="twitter:title" content="FonteVita — витамины и БАДы для всей семьи" />
              <meta name="twitter:description" content="Коллаген, магний + B6 и омега 3 в честных дозировках." />
              <meta name="twitter:image" content="https://fontevita-vitality-hub.lovable.app/__l5e/assets-v1/ace176ff-1b22-489c-a209-196f67f2c7b6/logo-mark.png" />
              <meta name="robots" content="index, follow" />
              <meta name="theme-color" content="#f5a623" />
              <meta name="author" content="FonteVita" />
              <meta name="keywords" content="FonteVita, витамины, БАДы, коллаген, магний, омега 3, добавки, здоровье" />
              <link rel="canonical" href="https://fontevita.ru/" />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link rel="preconnect" href="https://fontevita-vitality-hub.lovable.app" />
              <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"Organization","name":"FonteVita","url":"https://fontevita.ru","logo":"https://fontevita-vitality-hub.lovable.app/__l5e/assets-v1/ace176ff-1b22-489c-a209-196f67f2c7b6/logo-mark.png","description":"Российский бренд витаминов и БАДов для всей семьи."}
              </script>
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"WebSite","name":"FonteVita","url":"https://fontevita.ru"}
              </script>
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Чем FonteVita отличается от других БАДов?","acceptedAnswer":{"@type":"Answer","text":"Мы указываем реальные рабочие дозировки прямо на упаковке, проверяем каждую партию в лаборатории."}},{"@type":"Question","name":"Можно ли принимать продукты вместе?","acceptedAnswer":{"@type":"Answer","text":"Да, формулы совместимы."}},{"@type":"Question","name":"Когда будет заметен результат?","acceptedAnswer":{"@type":"Answer","text":"Первые изменения обычно на 3–4 неделе приёма."}},{"@type":"Question","name":"Как проходит доставка?","acceptedAnswer":{"@type":"Answer","text":"По России 1–2 дня, бесплатно от 3000 ₽."}}]}
              </script>
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"Product","name":"FonteVita Коллаген","brand":{"@type":"Brand","name":"FonteVita"},"offers":{"@type":"Offer","priceCurrency":"RUB","price":"1490","availability":"https://schema.org/InStock"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","reviewCount":"247"}}
              </script>
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"Product","name":"FonteVita Магний + B6","brand":{"@type":"Brand","name":"FonteVita"},"offers":{"@type":"Offer","priceCurrency":"RUB","price":"1190","availability":"https://schema.org/InStock"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","reviewCount":"247"}}
              </script>
              <script type="application/ld+json">
              {"@context":"https://schema.org","@type":"Product","name":"FonteVita Омега 3","brand":{"@type":"Brand","name":"FonteVita"},"offers":{"@type":"Offer","priceCurrency":"RUB","price":"1690","availability":"https://schema.org/InStock"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","reviewCount":"247"}}
              </script>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main-ghpages.tsx"></script>
              <script>window.replainSettings = { id: 'bdfb7302-81d5-4ce8-bf9b-d92aa1020761' };</script>
              <script src="https://widget.replain.cc/dist/client.js"></script>
            </body>
          </html>
          HTMLEOF

          # 404.html — SPA fallback for GitHub Pages client-side routing
          cp index.html 404.html

      - name: Build client SPA
        run: |
          bunx vite build --config vite.ghpages.config.ts
          # Copy 404.html for SPA fallback
          cp dist-ghpages/index.html dist-ghpages/404.html

          # Create static HTML files for every blog route so GitHub Pages
          # returns 200 instead of 404 when someone visits them directly.
          # The SPA takes over once loaded and renders the correct content.
          BLOG_SLUGS=(
            kollagen-dlya-chego-nuzhen-i-kak-prinimat
            magniy-v6-dlya-chego-nuzhen-kogda-pit
            omega-3-polza-i-vred-kak-vybrat
            sovmestimost-kollagen-magniy-omega-3
            kogda-nachinayut-deystvovat-vitaminy
            bad-ili-lekarstvo-v-chem-raznitsa
            kak-proverit-chestny-znak
            kak-vybrat-vitaminy-i-bady
            pochemu-nam-nuzhna-omega-3
          )
          CATEGORY_SLUGS=(kollagen magniy omega-3 guide)

          # /blog/ index
          mkdir -p dist-ghpages/blog
          cp dist-ghpages/index.html dist-ghpages/blog/index.html

          # /blog/<slug>
          for slug in "${BLOG_SLUGS[@]}"; do
            mkdir -p "dist-ghpages/blog/${slug}"
            cp dist-ghpages/index.html "dist-ghpages/blog/${slug}/index.html"
          done

          # /blog/category/<slug>
          for slug in "${CATEGORY_SLUGS[@]}"; do
            mkdir -p "dist-ghpages/blog/category/${slug}"
            cp dist-ghpages/index.html "dist-ghpages/blog/category/${slug}/index.html"
          done

          # /account
          mkdir -p dist-ghpages/account
          cp dist-ghpages/index.html dist-ghpages/account/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Build Telegram Mini App
        run: |
          cd miniapp
          npm ci
          npm run build
          cp -r dist ../dist-ghpages/miniapp

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-ghpages
          force_orphan: true
